CONFIG_MULTITHREADING=y
CONFIG_MAIN_STACK_SIZE=8192

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_THREAD_NAME=y

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# ESP-NOW uses the ESP-IDF WiFi blobs directly and never touches the Zephyr
# network stack. However, CONFIG_WIFI Kconfig-selects NET_L2_WIFI_MGMT
# which in turn selects NETWORKING, and NETWORKING requires NET_IPV4=y to
# satisfy its dependency chain. This is a known limitation of the current
# Kconfig structure for Espressif WiFi drivers — the IP stack symbols are
# required by the build system even though ESP-NOW bypasses them entirely.
CONFIG_WIFI=y
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y

# Minimise net_buf pool sizes to reclaim RAM — ESP-NOW never enqueues
# packets through the Zephyr net stack.
CONFIG_NET_PKT_RX_COUNT=4
CONFIG_NET_PKT_TX_COUNT=4
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_BUF_TX_COUNT=8
